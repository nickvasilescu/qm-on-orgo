# Generated by build.py from scripts/ and config/. Edit those, then rebuild.
# yaml-language-server: $schema=https://www.orgo.ai/api/template-schema
api_version: orgo.ai/v1
template:
  name: qm
  version: 0.1.7
  description: YC's QM multiplayer agent harness, self-hosted on one computer. Optional public https URL and email sign-in.
  license: MIT
  homepage: https://github.com/nickvasilescu/qm-on-orgo
  source: https://github.com/yc-software/qm
hardware:
  cpu: 4
  ram_gb: 16
  disk_gb: 60
  resolution: 1280x800x24
secrets:
- name: anthropic_api_key
  description: 'Anthropic API key for the agents. Optional: an admin can add any Anthropic, OpenAI or OpenRouter key in Admin
    > Onboarding instead.'
  example: sk-ant-...
  optional: true
  docs_url: https://console.anthropic.com/settings/keys
- name: qm_public_url
  description: Serve QM at this https URL, e.g. https://acme-qm.orgo.dev. Point it at port 18081 after launch (README). Leave
    unset for a private localhost test drive.
  example: https://acme-qm.orgo.dev
  optional: true
- name: resend_api_key
  description: Resend key for email sign-in links, so teammates can sign in. Needs qm_email_from.
  example: re_...
  optional: true
  docs_url: https://resend.com/api-keys
- name: qm_email_from
  description: Sender address verified in Resend.
  example: QM <qm@yourdomain.com>
  optional: true
- name: qm_admin_email
  description: Your email. Becomes an org admin who can sign in by email.
  example: you@yourdomain.com
  optional: true
- name: qm_allowed_email_domain
  description: Anyone with an email at this domain may sign in.
  example: yourdomain.com
  optional: true
env:
  ANTHROPIC_API_KEY:
    secret: anthropic_api_key
  QM_PUBLIC_URL:
    secret: qm_public_url
  RESEND_API_KEY:
    secret: resend_api_key
  QM_EMAIL_FROM:
    secret: qm_email_from
  QM_ADMIN_EMAIL:
    secret: qm_admin_email
  QM_ALLOWED_EMAIL_DOMAIN:
    secret: qm_allowed_email_domain
build:
  apt:
  - iptables
  - kmod
  - openssl
  - jq
  - curl
  - ca-certificates
  - git
  - python3
  run:
  - curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
  - DEBIAN_FRONTEND=noninteractive apt-get install -y nodejs
  - npm install -g npm@latest
  - curl -fsSL https://get.docker.com | sh
  - mkdir -p /opt/qm
  - cd /opt/qm && git init -q && npm exec --yes --package=@yc-software/qm@0.1.15 -- qm init . --org orgo --target docker </dev/null
  - cp /opt/qm-template/README-ORGO.md /opt/qm/README-ORGO.md
  - cd /opt/qm && npm install --no-audit --no-fund
  - /usr/local/bin/qm-bake
files:
- to: /etc/docker/daemon.json
  mode: '0644'
  when: build
  inline: |
    {"features": {"containerd-snapshotter": false}, "storage-driver": "overlay2"}
- to: /usr/local/bin/qm-env
  mode: '0644'
  when: build
  inline: |
    # Sourced by the qm-* scripts.
    export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    # Orgo sets XDG_RUNTIME_DIR to a directory that does not exist, which breaks Docker.
    unset XDG_RUNTIME_DIR

    qm_wait_docker() { for _ in $(seq 1 90); do docker info >/dev/null 2>&1 && return 0; sleep 2; done; return 1; }

    # Any HTTP status counts as up: the portal answers non-browser requests with 401.
    qm_http_up() { [ "$(curl -s -o /dev/null -m 5 -w '%{http_code}' "$1")" != "000" ]; }

    qm_public_url() { python3 -c 'import json,re;t=open("/opt/qm/qm.config.jsonc").read();print(json.loads(re.sub(r"^\s*//.*$","",t,flags=re.M))["publicUrl"])' 2>/dev/null; }

    # Per-computer signing secrets: minted once on first start, never baked into the snapshot.
    qm_secrets() {
      local jwk
      jwk=$(node -e "const {generateKeyPairSync}=require('node:crypto');process.stdout.write(JSON.stringify(generateKeyPairSync('ec',{namedCurve:'P-256'}).privateKey.export({format:'jwk'})))")
      umask 077
      cat > /opt/qm/.env <<EOF
    CAPABILITY_SECRET=$(openssl rand -hex 32)
    CONNECTOR_SECRET_KEY=$(openssl rand -hex 32)
    CORE_SIGNING_SECRET=$(openssl rand -hex 32)
    PORTAL_IDENTITY_SECRET=$(openssl rand -hex 32)
    SKILL_SIGNING_SECRET=$(openssl rand -hex 32)
    PORTAL_SESSION_SECRET=$(openssl rand -hex 32)
    AUTH_TOKEN_SECRET=$(openssl rand -hex 32)
    AUTH_CLIENT_SECRET=$(openssl rand -hex 32)
    AUTH_SIGNING_JWK=$jwk
    PUBLIC_API_URL=http://qm-orgo-core:8080
    EOF
    }
- to: /usr/local/bin/orgo-dockerd
  mode: '0755'
  when: build
  inline: |
    #!/bin/bash
    # Docker on Orgo: VMs boot without systemd or a mounted cgroup tree, so handle both here.
    export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    unset XDG_RUNTIME_DIR
    [ -f /sys/fs/cgroup/cgroup.controllers ] || mount -t cgroup2 none /sys/fs/cgroup
    # If a dockerd is already running (e.g. started during the bake), just watch it.
    pgrep -x dockerd >/dev/null && exec tail -f /dev/null --pid="$(pgrep -xo dockerd)"
    exec /usr/bin/dockerd
- to: /usr/local/bin/qm-configure
  mode: '0755'
  when: build
  inline: |
    #!/usr/bin/env python3
    """Render /opt/qm/qm.config.jsonc and the settings part of /opt/qm/.env.

    Inputs, later wins:
      /root/.env        template secrets injected by Orgo at launch
      /opt/qm/orgo.env  settings saved by qm-public / qm-email on this computer

    Settings:
      ANTHROPIC_API_KEY        base model key (optional; can be added in Admin > Onboarding instead)
      QM_PUBLIC_URL            https://<label>.orgo.dev or a custom domain. Unset = localhost test drive.
      RESEND_API_KEY           enables email sign-in links (needs QM_EMAIL_FROM)
      QM_EMAIL_FROM            verified Resend sender, e.g. "QM <qm@yourdomain.com>"
      QM_ADMIN_EMAIL           a real admin who can sign in by email
      QM_ALLOWED_EMAIL_DOMAIN  anyone @this domain may sign in, e.g. acme.com
      QM_ALLOWED_EMAILS        comma-separated extra addresses allowed to sign in

    Signing secrets in .env are generated once per computer by qm-start and never touched here.
    """
    import json
    import os
    import re
    import sys

    QM = "/opt/qm"
    LOCAL_ADMIN = "admin@qm.local"
    MANAGED = ["ANTHROPIC_API_KEY", "RESEND_API_KEY", "AUTH_EMAIL_FROM", "AUTH_ALLOWED_EMAILS"]


    def read_env(path):
        out = {}
        try:
            for line in open(path):
                line = line.strip()
                if not line or line.startswith("#") or "=" not in line:
                    continue
                k, v = line.split("=", 1)
                v = v.strip()
                if len(v) >= 2 and v[0] == v[-1] and v[0] in "'\"":
                    v = v[1:-1]
                out[k.strip()] = v
        except FileNotFoundError:
            pass
        return out


    def main():
        s = {}
        s.update(read_env("/root/.env"))
        s.update(read_env(f"{QM}/orgo.env"))
        get = lambda k: (s.get(k) or "").strip()

        public = get("QM_PUBLIC_URL").rstrip("/")
        if public and not re.fullmatch(r"https://[a-z0-9.-]+", public):
            sys.exit(f"QM_PUBLIC_URL must look like https://name.orgo.dev (got {public!r})")

        admin = get("QM_ADMIN_EMAIL").lower()
        grants = [f"{LOCAL_ADMIN}:org_admin"] + ([f"{admin}:org_admin"] if admin else [])
        allowed = [LOCAL_ADMIN] + ([admin] if admin else [])
        allowed += [e.strip().lower() for e in get("QM_ALLOWED_EMAILS").split(",") if e.strip()]

        auth_env = {"AUTH_EMAIL_TRANSPORT": "resend"}
        if get("QM_ALLOWED_EMAIL_DOMAIN"):
            auth_env["AUTH_ALLOWED_EMAIL_DOMAIN"] = get("QM_ALLOWED_EMAIL_DOMAIN").lower().lstrip("@")

        cfg = {
            "contract": 1,
            "orgId": "orgo",
            "publicUrl": public or "http://localhost:18081",
            "basePort": 18080,
            "target": "docker",
            "sandbox": {"backend": "local"},
            "services": ["core", "web-ui", "admin", "portal", "auth"],
            "plugins": [],
            "skills": [],
            "env": {
                "core": {"HARNESS": "pi", "ADMIN_GRANTS": ",".join(grants)},
                "auth": auth_env,
            },
        }
        if get("ANTHROPIC_API_KEY"):
            cfg["modelProvider"] = "anthropic"
        if not public:
            # Plain-http localhost test drive; production portal insists on https.
            cfg["env"]["portal"] = {"NODE_ENV": "development"}

        header = "// Generated by qm-configure on each start. Edit /opt/qm/orgo.env or use qm-public / qm-email.\n"
        with open(f"{QM}/qm.config.jsonc", "w") as f:
            f.write(header + json.dumps(cfg, indent=2) + "\n")

        managed = {"AUTH_ALLOWED_EMAILS": ",".join(dict.fromkeys(allowed))}
        if get("ANTHROPIC_API_KEY"):
            managed["ANTHROPIC_API_KEY"] = get("ANTHROPIC_API_KEY")
        if get("RESEND_API_KEY"):
            if not get("QM_EMAIL_FROM"):
                sys.exit("RESEND_API_KEY is set but QM_EMAIL_FROM is not (a sender verified in Resend)")
            managed["RESEND_API_KEY"] = get("RESEND_API_KEY")
            managed["AUTH_EMAIL_FROM"] = get("QM_EMAIL_FROM")

        env_path = f"{QM}/.env"
        kept = [l for l in open(env_path).read().splitlines()
                if l.split("=", 1)[0].strip() not in MANAGED] if os.path.exists(env_path) else []
        os.umask(0o077)
        with open(env_path, "w") as f:
            f.write("\n".join(kept + [f"{k}={v}" for k, v in managed.items()]) + "\n")

        mode = public or "http://localhost:18081 (local test drive)"
        email = "on" if "RESEND_API_KEY" in managed else "off (admin-login links only)"
        print(f"qm-configure: url={mode} email={email} admins={','.join(g.split(':')[0] for g in grants)}")


    if __name__ == "__main__":
        main()
- to: /usr/local/bin/qm-bake
  mode: '0755'
  when: build
  inline: |
    #!/bin/bash
    # Build-time only. If the build box has room, pull every image and build the sandbox image so
    # launches are fast; then throw away the throwaway secrets and data. Orgo's build box currently
    # has an 8 GB disk, so this usually skips and the first launch pulls (~3 minutes).
    set -euo pipefail
    . /usr/local/bin/qm-env
    trap 'echo "--- disk at bake exit"; lsblk -o NAME,SIZE 2>/dev/null || true; df -h / || true' EXIT
    resize2fs "$(findmnt -no SOURCE /)" >/dev/null 2>&1 || true
    pgrep -x dockerd >/dev/null || { setsid /usr/local/bin/orgo-dockerd >/var/log/dockerd-bake.log 2>&1 < /dev/null & }
    qm_wait_docker
    docker info --format 'storage: {{.Driver}}'
    cd /opt/qm
    qm_secrets
    /usr/local/bin/qm-configure
    npm exec qm -- check
    free_gb=$(df -BG --output=avail / | tail -1 | tr -dc 0-9)
    if [ "${free_gb:-0}" -lt 14 ]; then
      echo "only ${free_gb}G free on the build box: skipping image pre-pull; first launch pulls"
    else
      if ! npm exec qm -- up; then
        echo "qm up failed at bake; retrying once"; sleep 15
        npm exec qm -- up || echo "WARN: layer sync failed at bake (launch re-syncs)"
      fi
      npm exec qm -- down --purge
      # Drop build cache only. Never `docker image prune`: QM pulls by digest, so its images look dangling.
      docker builder prune -af >/dev/null
    fi
    rm -f /opt/qm/.env /opt/qm/.instance-secrets /opt/qm/.opened
    touch /opt/qm/.baked
- to: /usr/local/bin/qm-start
  mode: '0755'
  when: build
  inline: |
    #!/bin/bash
    # Bring QM up on this computer. Runs on every launch (via qm-watch) and after qm-public / qm-email.
    # Idempotent and locked, so overlapping triggers are harmless.
    set -uo pipefail
    . /usr/local/bin/qm-env
    # Background children are started with 9>&- so a long-lived process (dockerd, Chrome) never
    # inherits fd 9 and holds this lock forever.
    exec 9>/run/qm-start.v2.lock
    flock -n 9 || { echo "qm-start already running"; exit 0; }
    exec > >(tee -a /var/log/qm-start.log 9>&-) 2>&1
    echo "== qm-start $(date -Is)"
    cd /opt/qm
    pgrep -x dockerd >/dev/null || { setsid /usr/local/bin/orgo-dockerd >/var/log/dockerd.log 2>&1 < /dev/null 9>&- & }
    qm_wait_docker || { echo "docker did not start"; exit 1; }

    [ -f /opt/qm/.instance-secrets ] || { qm_secrets && touch /opt/qm/.instance-secrets; }
    /usr/local/bin/qm-configure || { echo "qm-configure failed; fix the setting above and rerun qm-start"; exit 1; }

    # Firewall: QM's ports never face the network directly. In public-URL mode, Orgo's edge
    # may reach the portal (18081) only; core, web UI and admin stay closed.
    ext=$(ip -o -4 route show default | awk '{print $5}' | head -1)
    if [ -n "$ext" ]; then
      iptables -C DOCKER-USER -i "$ext" -p tcp -m conntrack --ctorigdstport 18080:18089 -j DROP 2>/dev/null \
        || iptables -I DOCKER-USER -i "$ext" -p tcp -m conntrack --ctorigdstport 18080:18089 -j DROP
      allow=(-i "$ext" -p tcp -m conntrack --ctorigdstport 18081 -j RETURN)
      if [[ "$(qm_public_url)" == https://* ]]; then
        iptables -C DOCKER-USER "${allow[@]}" 2>/dev/null || iptables -I DOCKER-USER 1 "${allow[@]}"
      else
        while iptables -D DOCKER-USER "${allow[@]}" 2>/dev/null; do :; done
      fi
    fi

    ok=0
    for attempt in 1 2 3; do
      if npm exec qm -- up; then ok=1; break; fi
      echo "qm up attempt $attempt failed; retrying"; sleep 15
    done
    if [ "$ok" != 1 ]; then
      # `up` can fail only on its final deployment-layer sync while every service is healthy.
      if curl -fs -o /dev/null http://localhost:18080/healthz && qm_http_up http://localhost:18081/; then
        echo "WARN: qm up reported an error but core and portal are healthy; continuing"
      else
        echo "QM failed to start; see above and: cd /opt/qm && npm exec qm -- logs core"; exit 1
      fi
    fi

    # QM 0.1.15 bug: core reads QM_CORE_CONTAINER into the AWS sandbox config instead of the local
    # one, so it dials 127.0.0.1:<port> inside its own container and every sandbox command is
    # refused. Patch core in place (re-applied whenever `qm up` recreates it); no-op once fixed upstream.
    patch_core() {
      local c=qm-orgo-core f=/app/src/config.ts
      docker exec "$c" grep -q 'qm-on-orgo patch' "$f" 2>/dev/null && return 0
      docker exec "$c" sed -n '/^function localSandboxEnv/,/^}/p' "$f" | grep -q QM_CORE_CONTAINER && return 0
      docker exec -u root "$c" sed -i '/LOCAL_SANDBOX_DOCKER_BIN ? { dockerBin: env.LOCAL_SANDBOX_DOCKER_BIN }/a\    ...(env.QM_CORE_CONTAINER ? { coreContainer: env.QM_CORE_CONTAINER } : {}), // qm-on-orgo patch' "$f" || return 1
      docker exec "$c" grep -q 'qm-on-orgo patch' "$f" || { echo "WARN: core layout changed; sandbox patch not applied"; return 1; }
      # Sandboxes started by the unpatched core published a port instead of joining core's network.
      for s in $(docker ps -aq --filter label=qm.sandbox=1); do
        [ -n "$(docker port "$s" 2>/dev/null)" ] && docker rm -f "$s" >/dev/null
      done
      docker restart "$c" >/dev/null
      for _ in $(seq 1 30); do curl -fs -o /dev/null http://localhost:18080/healthz && break; sleep 2; done
      echo "patched core: sandboxes reach core over Docker's network"
    }
    patch_core || true

    echo "QM is up at $(qm_public_url)"
    # Open the admin sign-in in this computer's Chrome once, on the first launch. Later: qm-open.
    if [ ! -f /opt/qm/.opened ]; then /usr/local/bin/qm-open 9>&- && touch /opt/qm/.opened; fi
    echo "== qm-start done $(date -Is)"
- to: /usr/local/bin/qm-watch
  mode: '0755'
  when: build
  inline: |
    #!/bin/bash
    # Launch trigger. A template launch restores a frozen memory snapshot, so this loop resumes
    # and sees the wall clock jump. That (once the bake has finished) means: start QM.
    # Also fires after a suspend/resume, which is harmless: qm-start is idempotent and locked.
    last=$(date +%s)
    while true; do
      sleep 5
      now=$(date +%s)
      if [ $((now - last)) -gt 20 ] && [ -f /opt/qm/.baked ]; then
        setsid /usr/local/bin/qm-start </dev/null >/dev/null 2>&1 &
      fi
      last=$now
    done
- to: /usr/local/bin/qm-open
  mode: '0755'
  when: build
  inline: |
    #!/bin/bash
    # Mint a one-time admin sign-in link (valid 5 minutes), print it, and open it in this computer's Chrome.
    # Paste the printed link (all of it, including #token=...) into any browser when QM has a public URL.
    . /usr/local/bin/qm-env
    cd /opt/qm
    for _ in $(seq 1 90); do qm_http_up http://localhost:18081/ && break; sleep 2; done
    url=$(npm exec --silent qm -- admin-login --email admin@qm.local 2>/dev/null | grep -E '^https?://' | tail -1)
    [ -n "$url" ] || { echo "admin-login failed; is QM up? (npm exec qm -- status)"; exit 1; }
    echo "Admin sign-in link (one-time, 5 minutes):"
    echo "$url"
    disp=":$(ls /tmp/.X11-unix 2>/dev/null | head -1 | tr -dc 0-9)"
    if [ "$disp" != ":" ]; then
      DISPLAY="$disp" setsid /usr/local/bin/google-chrome --no-sandbox --no-first-run --no-default-browser-check \
        --start-maximized "$url" >/dev/null 2>&1 < /dev/null 9>&- &
      echo "(also opened in this computer's Chrome)"
    fi
- to: /usr/local/bin/qm-public
  mode: '0755'
  when: build
  inline: |
    #!/bin/bash
    # Serve QM on a public https URL, or go back to the local test drive.
    #   qm-public https://acme-qm.orgo.dev   first point that URL at port 18081 (see README), then run this
    #   qm-public off                        back to http://localhost:18081
    #   qm-public                            show the current URL
    set -euo pipefail
    . /usr/local/bin/qm-env
    S=/opt/qm/orgo.env
    touch "$S"; chmod 600 "$S"
    case "${1:-}" in
      "") echo "QM URL: $(qm_public_url)"; exit 0 ;;
      off) sed -i '/^QM_PUBLIC_URL=/d' "$S"; echo "QM_PUBLIC_URL=" >> "$S" ;;
      https://*)
        url="${1%/}"
        code=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "$url/" || true)
        [ "$code" = "000" ] && { echo "Can't reach $url. Point it at port 18081 first (README: 'Public URL')."; exit 1; }
        sed -i '/^QM_PUBLIC_URL=/d' "$S"; echo "QM_PUBLIC_URL=$url" >> "$S" ;;
      *) echo "usage: qm-public https://name.orgo.dev | off"; exit 1 ;;
    esac
    /usr/local/bin/qm-start
- to: /usr/local/bin/qm-email
  mode: '0755'
  when: build
  inline: |
    #!/bin/bash
    # Turn on email sign-in links (Resend) so teammates can sign in, then restart QM.
    # Prompts for everything; the API key is read silently and stored only in /opt/qm/orgo.env (mode 600).
    #   qm-email        set up or change
    #   qm-email off    turn email sign-in off again
    set -euo pipefail
    . /usr/local/bin/qm-env
    S=/opt/qm/orgo.env
    touch "$S"; chmod 600 "$S"
    setv() { sed -i "/^$1=/d" "$S"; printf '%s=%s\n' "$1" "$2" >> "$S"; }

    if [ "${1:-}" = "off" ]; then
      sed -i '/^RESEND_API_KEY=/d;/^QM_EMAIL_FROM=/d' "$S"
      exec /usr/local/bin/qm-start
    fi

    [[ "$(qm_public_url)" == https://* ]] || echo "Note: email links point at $(qm_public_url). Set a public URL first (qm-public) so links work outside this computer."
    read -rsp "Resend API key (re_...): " key; echo
    [[ "$key" == re_* ]] || { echo "That doesn't look like a Resend key."; exit 1; }
    read -rp "Sender, verified in Resend (e.g. QM <qm@yourdomain.com>): " from
    [ -n "$from" ] || { echo "A sender is required."; exit 1; }
    read -rp "Your admin email (signs in by email): " admin
    read -rp "Let everyone @domain sign in? Enter a domain or leave blank: " domain
    read -rp "Other emails allowed to sign in (comma-separated, optional): " others

    setv RESEND_API_KEY "$key"
    setv QM_EMAIL_FROM "$from"
    [ -n "$admin" ] && setv QM_ADMIN_EMAIL "$admin"
    [ -n "$domain" ] && setv QM_ALLOWED_EMAIL_DOMAIN "$domain"
    [ -n "$others" ] && setv QM_ALLOWED_EMAILS "$others"
    unset key
    exec /usr/local/bin/qm-start
- to: /opt/qm-template/README-ORGO.md
  mode: '0644'
  when: build
  inline: |
    # QM on Orgo

    QM (YC's multiplayer agent harness) runs here as a single-host Docker deployment:
    core, web UI, admin, Postgres, and one sandbox container per person or room.

      qm-open                 fresh one-time admin sign-in link (5 minutes)
      qm-public https://...   serve QM on a public https URL (point it at port 18081 first)
      qm-public off           back to the private localhost test drive
      qm-email                turn on email sign-in for teammates (Resend)
      cd /opt/qm && npm exec qm -- status | logs core | up | down

    Startup log: /var/log/qm-start.log   Settings: /opt/qm/orgo.env
    Docs and source: https://github.com/nickvasilescu/qm-on-orgo
apps:
- name: docker
  title: Docker Engine
  description: Runs QM's services and one isolated container per agent scope.
  services:
  - name: dockerd
    run: /usr/local/bin/orgo-dockerd
    user: root
    restart: always
    log: /var/log/dockerd.log
- name: qm
  title: QM
  description: YC's multiplayer agent harness. Portal on port 18081.
  requires:
  - docker
  data:
  - /opt/qm
  services:
  - name: qm-watch
    title: QM launcher
    description: Starts QM on each launch of this template.
    run: /usr/local/bin/qm-watch
    user: root
    restart: always
    log: /var/log/qm-watch.log
  ports:
  - internal: 18081
    protocol: http
    public: false
    description: QM portal (sign-in, web chat, admin)
terminal:
- name: qm
  title: QM
  cwd: /opt/qm
  run: cat /opt/qm/README-ORGO.md; tail -n 20 -F /var/log/qm-start.log
hooks:
  on_resume: 'setsid /usr/local/bin/qm-start </dev/null >/dev/null 2>&1 &

    '
